<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>С Новым годом!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0b1233;
    --bg2: #1d2a6b;
    --bg3: #3a2a77;
    --gold: #ffd98a;
    --ice: #dff3ff;
    --red: #ff5d73;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--ice);
    background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    overflow: hidden;
  }

  /* звёзды */
  .stars {
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, #fff, transparent),
      radial-gradient(1px 1px at 25% 60%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 40% 15%, #fff, transparent),
      radial-gradient(1px 1px at 55% 45%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 70% 25%, #fff, transparent),
      radial-gradient(1px 1px at 82% 55%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 92% 12%, #fff, transparent),
      radial-gradient(1px 1px at 15% 80%, #fff, transparent),
      radial-gradient(1px 1px at 62% 78%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 88% 85%, #fff, transparent);
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .45; } to { opacity: 1; } }

  canvas#snow { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  /* гирлянда */
  #garland { position: fixed; top: 0; left: 0; width: 100%; height: 90px; pointer-events: none; z-index: 6; }
  #garland svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bulb {
    position: absolute; width: 12px; height: 16px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    transform: translate(-50%, 0);
    animation: glow 1.8s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { filter: brightness(.55); box-shadow: 0 0 4px 0 currentColor; }
    to   { filter: brightness(1.25); box-shadow: 0 0 16px 4px currentColor; }
  }

  /* ёлки */
  .forest { position: fixed; left: 0; right: 0; bottom: 0; height: 26vh; min-height: 140px; z-index: 3; pointer-events: none; }
  .forest svg { width: 100%; height: 100%; display: block; }
  .ground {
    position: fixed; left: 0; right: 0; bottom: 0; height: 48px; z-index: 4;
    background: linear-gradient(180deg, #e9f6ff, #bfdcf2);
    border-radius: 60% 60% 0 0 / 100% 100% 0 0;
    box-shadow: 0 -6px 30px rgba(223,243,255,.35);
  }

  /* экран пароля и страница */
  .screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    transition: opacity .8s ease, visibility .8s ease;
  }
  .screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .card {
    width: min(420px, 100%);
    padding: 36px 30px;
    text-align: center;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 24px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  .card h1 {
    font-family: 'Playfair Display', serif; font-weight: 600;
    font-size: 1.9rem; margin-bottom: 8px; color: var(--gold);
  }
  .card p { opacity: .8; margin-bottom: 22px; font-size: .98rem; }
  .card .emoji { font-size: 2.6rem; margin-bottom: 8px; }

  form { display: flex; flex-direction: column; gap: 12px; }
  input[type=password] {
    width: 100%; padding: 14px 16px; font: inherit; font-size: 1.05rem; text-align: center;
    color: #fff; background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.3); border-radius: 14px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type=password]::placeholder { color: rgba(255,255,255,.55); }
  input[type=password]:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,217,138,.25); }
  button {
    padding: 14px; font: inherit; font-weight: 600; font-size: 1.05rem; cursor: pointer;
    color: #3a1b00; background: linear-gradient(135deg, #ffe7a8, #ffc15e);
    border: none; border-radius: 14px;
    transition: transform .15s, box-shadow .2s;
    box-shadow: 0 6px 20px rgba(255,193,94,.35);
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(255,193,94,.5); }
  .error { min-height: 1.3em; margin-top: 12px; color: #ff9aa8; font-size: .92rem; }
  .shake { animation: shake .4s; }
  @keyframes shake {
    20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); }
  }

  .main { text-align: center; max-width: 640px; }
  .main .emoji { font-size: 3rem; margin-bottom: 10px; }
  .main h2 {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500;
    font-size: clamp(2rem, 6vw, 3.4rem); color: var(--gold); margin-bottom: 20px;
    text-shadow: 0 0 24px rgba(255,217,138,.45);
  }
  .main p {
    font-size: clamp(1.05rem, 2.6vw, 1.3rem); line-height: 1.7;
    padding: 24px 28px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 22px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
</style>
</head>
<body>

<div class="stars"></div>
<canvas id="snow"></canvas>
<div id="garland"></div>

<div class="forest">
  <svg viewBox="0 0 1200 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <g id="tree">
        <polygon points="0,-120 28,-70 14,-70 38,-30 18,-30 46,10 -46,10 -18,-30 -38,-30 -14,-70 -28,-70" fill="#0d2b3e"/>
        <polygon points="0,-120 12,-95 -12,-95" fill="#eaf6ff"/>
        <polygon points="-14,-70 14,-70 22,-58 -22,-58" fill="#eaf6ff" opacity=".9"/>
        <polygon points="-18,-30 18,-30 28,-16 -28,-16" fill="#eaf6ff" opacity=".9"/>
      </g>
    </defs>
    <g transform="translate(60,185) scale(1.1)"><use href="#tree"/></g>
    <g transform="translate(170,190) scale(.8)"><use href="#tree"/></g>
    <g transform="translate(290,185) scale(1.3)"><use href="#tree"/></g>
    <g transform="translate(420,192) scale(.7)"><use href="#tree"/></g>
    <g transform="translate(540,188) scale(.95)"><use href="#tree"/></g>
    <g transform="translate(680,190) scale(.75)"><use href="#tree"/></g>
    <g transform="translate(800,185) scale(1.25)"><use href="#tree"/></g>
    <g transform="translate(930,192) scale(.8)"><use href="#tree"/></g>
    <g transform="translate(1040,186) scale(1.05)"><use href="#tree"/></g>
    <g transform="translate(1150,190) scale(.9)"><use href="#tree"/></g>
  </svg>
</div>
<div class="ground"></div>

<!-- ЭКРАН ПАРОЛЯ -->
<section class="screen" id="gate">
  <div class="card" id="gateCard">
    <div class="emoji">🎄</div>
    <h1>Тут кое-что для тебя</h1>
    <p>Введи пароль, чтобы открыть</p>
    <form id="form" autocomplete="off">
      <input type="password" id="pwd" placeholder="Пароль" autofocus required>
      <button type="submit">Открыть</button>
    </form>
    <div class="error" id="err"></div>
  </div>
</section>

<!-- САМА СТРАНИЦА -->
<section class="screen hidden" id="page">
  <div class="main">
    <div class="emoji">✨❄️✨</div>
    <h2>С Новым годом!</h2>
    <!-- ↓↓↓ СЮДА ВСТАВЬ СВОЙ ТЕКСТ ↓↓↓ -->
    <p>
      Здесь будет твой текст. Пусть новый год принесёт тепло, радость и много
      приятных моментов. Спасибо, что ты есть!
    </p>
    <!-- ↑↑↑ КОНЕЦ ТЕКСТА ↑↑↑ -->
  </div>
</section>

<script>
  // SHA-256 хэш пароля. По умолчанию пароль: snowflake2027
  // Как поменять пароль — см. инструкцию в сообщении/README.
  const PASSWORD_HASH = "4e3fde4b3ddebb4bf79881d1eb039af4dc479904def5427c6a29bb1650f22081";

  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  const gate = document.getElementById("gate");
  const page = document.getElementById("page");
  const card = document.getElementById("gateCard");
  const err = document.getElementById("err");

  function unlock() {
    gate.classList.add("hidden");
    page.classList.remove("hidden");
  }

  try { if (sessionStorage.getItem("ny-unlocked") === "1") unlock(); } catch (e) {}

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const value = document.getElementById("pwd").value;
    const hash = await sha256(value);
    if (hash === PASSWORD_HASH) {
      try { sessionStorage.setItem("ny-unlocked", "1"); } catch (e) {}
      unlock();
    } else {
      err.textContent = "Неверный пароль, попробуй ещё раз";
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
      document.getElementById("pwd").select();
    }
  });

  /* ---------- Снег ---------- */
  const canvas = document.getElementById("snow");
  const ctx = canvas.getContext("2d");
  let W, H, flakes = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    const count = Math.min(160, Math.floor(W / 8));
    flakes = Array.from({ length: count }, () => makeFlake(true));
  }
  function makeFlake(randomY) {
    return {
      x: Math.random() * W,
      y: randomY ? Math.random() * H : -10,
      r: Math.random() * 2.8 + 0.8,
      s: Math.random() * 0.9 + 0.4,
      d: Math.random() * Math.PI * 2,
      o: Math.random() * 0.5 + 0.5
    };
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const f of flakes) {
      f.d += 0.01;
      f.y += f.s;
      f.x += Math.sin(f.d) * 0.5;
      if (f.y > H + 10) Object.assign(f, makeFlake(false));
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${f.o})`;
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener("resize", resize);
  resize();
  draw();

  /* ---------- Гирлянда ---------- */
  function buildGarland() {
    const box = document.getElementById("garland");
    box.innerHTML = "";
    const w = window.innerWidth;
    const sag = 34;
    const colors = ["#ff5d73", "#ffd98a", "#6ee7b7", "#7cc4ff", "#c4a1ff"];

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${w} 90`);
    svg.setAttribute("preserveAspectRatio", "none");
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", `M0,8 Q${w / 4},${8 + sag * 2} ${w / 2},8 T${w},8`);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#1a1a1a");
    path.setAttribute("stroke-width", "2");
    svg.appendChild(path);
    box.appendChild(svg);

    const step = 46;
    const n = Math.floor(w / step);
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      // точка на двух квадратичных кривых (приблизительно синусоида)
      const x = t * w;
      const u = (t * 2) % 1 || (t === 1 ? 0 : 0);
      const y = 8 + 4 * sag * u * (1 - u);
      const b = document.createElement("div");
      const c = colors[i % colors.length];
      b.className = "bulb";
      b.style.left = x + "px";
      b.style.top = y + "px";
      b.style.background = c;
      b.style.color = c;
      b.style.animationDelay = (i % 5) * 0.35 + "s";
      box.appendChild(b);
    }
  }
  buildGarland();
  window.addEventListener("resize", buildGarland);
</script>
</body>
</html>
